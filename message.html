<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>留言板 - 銲接證照考試訓練</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .message-board {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
    }
    .message-board h2 {
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }
    form label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #444;
    }
    form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    form button {
      margin-top: 16px;
      padding: 10px 20px;
      background-color: #e25822;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #messages li {
      background-color: #f0f0f0;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-left: 6px solid #e25822;
      border-radius: 8px;
      color: #000;
      list-style: none;
    }
    .nested {
      margin-left: 40px;
    }
    .delete-btn, .reply-btn {
      margin-left: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #555;
    }
    .delete-btn:hover {
      color: #c00;
    }
    .back-home {
      text-align: center;
      margin-top: 30px;
    }
    .back-home a {
      text-decoration: none;
      color: white;
      background-color: #FF6347;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    .back-home a:hover {
      background-color: #00ff2f;
    }
  </style>
</head>
<body>
  <header>
    <h1 style="text-align:center;">留言板</h1>
  </header>

  <section class="message-board">
    <h2>歡迎留言</h2>
    <form id="message-form">
      <label for="message">留言內容:</label>
      <textarea id="message" rows="4" required></textarea>
      <input type="hidden" id="parentId" value="">
      <button type="submit">送出留言</button>
    </form>

    <div id="message-list">
      <h3>留言紀錄：</h3>
      <ul id="messages"></ul>
    </div>
  </section>

  <div class="back-home">
    <a href="home.html">回到首頁</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqoHAGQ42luK6k0v9XiRP59Es4gpVm95Q",
      authDomain: "learningproject-fc101.firebaseapp.com",
      projectId: "learningproject-fc101",
      storageBucket: "learningproject-fc101.appspot.com",
      messagingSenderId: "926810721151",
      appId: "1:926810721151:web:70da1b738f58ea7692284a",
      measurementId: "G-09SC8T46GD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("message-form");
    const messageInput = document.getElementById("message");
    const messagesEl = document.getElementById("messages");
    const parentIdInput = document.getElementById("parentId");

    // 建立唯一 localStorage 使用者 ID（模擬登入）
    let localUserId = localStorage.getItem("localUserId");
    if (!localUserId) {
      localUserId = "user_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      localStorage.setItem("localUserId", localUserId);
    }

    // 監聽留言變動並渲染
    onSnapshot(collection(db, "messages"), (snapshot) => {
      const allMessages = [];
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        allMessages.push({ id: docSnap.id, ...data });
      });

      // 按時間新→舊排序
      allMessages.sort((a, b) => b.time - a.time);

      // 建立以 id 為鍵的 map 和巢狀結構
      const map = {};
      const roots = [];
      allMessages.forEach(msg => {
        msg.children = [];
        map[msg.id] = msg;
      });
      allMessages.forEach(msg => {
        if (msg.parentId && map[msg.parentId]) {
          map[msg.parentId].children.push(msg);
        } else {
          roots.push(msg);
        }
      });

      // 清空舊留言
      messagesEl.innerHTML = "";

      // 遞迴渲染留言及回覆
      function renderMessage(msg, container, isReply = false) {
        const li = document.createElement("li");
        if (isReply) li.classList.add("nested");
        li.innerHTML = `
          <div>${escapeHtml(msg.content)}</div>
          <small>${new Date(msg.time).toLocaleString()}</small>
        `;

        // 回覆按鈕
        const replyBtn = document.createElement("button");
        replyBtn.className = "reply-btn";
        replyBtn.innerText = "回覆";
        replyBtn.onclick = () => {
          parentIdInput.value = msg.id;
          messageInput.focus();
        };
        li.appendChild(replyBtn);

        // 刪除按鈕（僅自己留言可刪）
        if (msg.userId === localUserId) {
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerText = "🗑️";
          delBtn.onclick = async () => {
            // 刪除留言前要先確定是否有回覆？(本範例直接刪)
            await deleteDoc(doc(db, "messages", msg.id));
          };
          li.appendChild(delBtn);
        }

        container.appendChild(li);

        // 子留言遞迴
        if (msg.children.length > 0) {
          const ul = document.createElement("ul");
          msg.children.forEach(child => renderMessage(child, ul, true));
          container.appendChild(ul);
        }
      }

      roots.forEach(msg => renderMessage(msg, messagesEl));
    });

    // 送出留言
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const content = messageInput.value.trim();
      const parentId = parentIdInput.value || null;
      if (!content) return alert("請輸入留言內容");

      await addDoc(collection(db, "messages"), {
        userId: localUserId,
        content,
        parentId,
        time: Date.now()
      });

      messageInput.value = "";
      parentIdInput.value = "";
    });

    // 輔助：防止 XSS
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
