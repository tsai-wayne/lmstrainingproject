<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>題庫練習</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('image/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    header {
      background-color: rgba(0, 0, 0, 0.9);
      color: #FF4500;
      text-align: center;
      padding: 20px 0;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 6px;
    }

    .back-home {
      text-align: center;
      margin-top: 30px;
    }

    .back-home a {
      text-decoration: none;
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .back-home a:hover {
      background-color: #1e7e34;
    }
    #finishBtn {
    display: inline-block;
    background: #28a745;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(40, 167, 69, 0.6);
    transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    user-select: none;
    margin: 30px auto;
    display: block;
  }

  #finishBtn:hover {
    background-color: #218838;
    box-shadow: 0 7px 16px rgba(33, 136, 56, 0.8);
    transform: translateY(-2px);
  }

  #finishBtn:active {
    background-color: #1e7e34;
    box-shadow: 0 4px 10px rgba(30, 126, 52, 0.7);
    transform: translateY(1px);
  }
  </style>
</head>
<body>
  <header>
    題庫練習 - 焊接模擬考試
  </header>

  <main>
    <iframe 
      src="https://dive.nutn.edu.tw/Experiment/kaleTestExperiment5.jsp?eid=33330&record=false" 
      name="dive" frameborder="0">
    </iframe>

    <!-- ✅ Firebase SDK（compat 版本） -->
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-auth-compat.js"></script>


    <!-- ✅ Firebase 初始化 -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCqoHAGQ42luK6k0v9XiRP59Es4gpVm95Q",
        authDomain: "learningproject-fc101.firebaseapp.com",
        projectId: "learningproject-fc101",
        storageBucket: "learningproject-fc101.firebasestorage.app",
        messagingSenderId: "926810721151",
        appId: "1:926810721151:web:70da1b738f58ea7692284a",
        measurementId: "G-09SC8T46GD"
      };
      firebase.initializeApp(firebaseConfig);
    </script>

    <!-- ✅ DiVE linker（只要載入一次） -->
    <script src="https://dive.nutn.edu.tw/Experiment/js/dive.linker.min.js"></script>

    <!-- ✅ 自己的 IO.js 腳本 -->
    <script src="IO.js"></script>

  <button id="finishBtn">完成本題</button>
<script>
  const currentIndex = 2; // 根據題號改成 1~8
  document.getElementById("finishBtn").addEventListener("click", () => {
    const finishedCount = parseInt(localStorage.getItem("finishedCount")) || 0;
    const unlockedCount = parseInt(localStorage.getItem("unlockedCount")) || 1;

    // 如果目前完成比記錄更多，更新
    if (currentIndex > finishedCount) {
      localStorage.setItem("finishedCount", currentIndex);
    }

    // 如果這題剛好是目前最後解鎖的，解鎖下一題
    if (currentIndex === unlockedCount && unlockedCount < 8) {
      localStorage.setItem("unlockedCount", unlockedCount + 1);
    }

    alert("本題已完成！");
    window.location.href = "practice.html"; // 回到選題頁
  });
</script>
  </main>
</body>
</html>
